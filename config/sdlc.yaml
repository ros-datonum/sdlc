version: 1

model_runtime:
  transport: local_cli_oauth

  # Runtime used when a role does not define one.
  # `model: null` means: use that local CLI's currently configured/default model.
  default:
    runtime: claude
    model: null

  runtimes:
    claude:
      executable: claude
      auth_check:
        args: ["auth", "status"]
      invocation:
        mode: print
      forbid_console_api_auth: true

    codex:
      executable: codex
      auth_check:
        args: ["login", "status"]
      invocation:
        mode: exec
      require_chatgpt_oauth: true

  roles:
    raw_requirement_processor:
      runtime: claude
      model: null

# Selection precedence for implementation:
# 1. explicit CLI/run override
# 2. role runtime/model above
# 3. model_runtime.default
# 4. local CLI default model when model is null
#
# This file contains no credentials.
