version = 1

# Model runtime configuration.
#
# TOML has no null. Omitting `model` means: use that local CLI's own default
# model. Omitting a role means: fall back to [model_runtime.default].
#
# This file contains no credentials. Authentication is whatever the local CLI
# already holds; see docs/runtime/Local-OAuth-Model-Runtime-Spec-v0.1.md.

[model_runtime]
transport = "local_cli_oauth"

# Used when a role defines no runtime of its own.
[model_runtime.default]
runtime = "claude"
# model = "..."   # omitted: use the local CLI default model

# `invocation_mode` names the CLI family: "print" is Claude Code (`claude -p`),
# "exec" is Codex (`codex exec`). The authentication check (claude.ai login on
# the first-party API; ChatGPT login) and the reasoning-child restrictions
# follow the family and are not configurable here.
#
# Support matrix: Claude Code executes only as the one build qualified below
# (Local-OAuth-Model-Runtime-Claude-2.1.306-Amendment-v0.1). Codex is
# blocked for SDLC reasoning execution: its tool boundary failed review on
# codex-cli 0.146.0, so a run selecting it fails with
# RUNTIME_ISOLATION_UNAVAILABLE before any subprocess and nothing else is
# substituted. The selection stays representable; no key here re-enables it.
#
# `environment_passthrough` may list extra variable names the CLI needs in a
# particular environment (for example HTTPS_PROXY). Provider, API-key,
# base-URL and application-secret names are refused when the file loads.
#
# Under the restrictions the CLI ignores the user's own settings, so "use the
# local CLI default model" means that CLI build's default, not the model set
# in ~/.claude/settings.json or ~/.codex/config.toml. Reproducible runs
# should set `model` here explicitly.

[model_runtime.runtimes.claude]
# A dedicated, machine-local alias for the qualified build, never the user's
# interactive `claude`, which its auto-updater repoints. Set it up once per
# machine (Local-OAuth-Model-Runtime-Claude-2.1.306-Amendment-v0.1 §2.1):
#   ln -s <claude versions dir>/2.1.306 <a PATH dir>/sdlc-claude-2.1.306
# A missing alias, or one naming any other file, refuses every Claude call;
# nothing falls back to `claude`.
executable = "sdlc-claude-2.1.306"
invocation_mode = "print"
# environment_passthrough = []

# The one Claude Code build qualified for SDLC reasoning execution. `sha256`
# is the SHA-256 of the executable file `claude` resolves to (symlinks
# followed); that file runs the login check and the inference. Any other
# build, an updated one included, fails with RUNTIME_ISOLATION_UNAVAILABLE
# before any process starts and needs its own qualification. `version` and
# `builtin_plugins` are what this build must report in its own session init
# under the SDLC restrictions with telemetry disabled: on 2.1.306 that is the
# AGENTS.md and plugin-authoring built-ins, and the telemetry plugin is then
# not registered. Change these only with a new qualification record.
[model_runtime.runtimes.claude.qualified_binary]
sha256 = "b5d795b7760032d79954b55a9cd1876dcf3a8dc9608fd6bb9f618593f69fd44b"
version = "2.1.306"
builtin_plugins = ["cc-plugin-agents-md", "cc-plugin-plugin-authoring"]
# The SDK control-protocol features this build advertises in its init record:
# requests an SDK host could send over `--input-format stream-json`, which SDLC
# never uses. Protocol support, not model tools; the exact set is required.
protocol_capabilities = [
    "interrupt_receipt_v1",
    "interrupt_cancel_queued_v1",
    "interrupt_send_now_v1",
    "msg_lifecycle_v1",
    "request_marker_lists_v1",
    "sdk_mcp_tools_list_changed",
    "sdk_mcp_manifests",
    "mcp_read_resource_v1",
    "mcp_tool_ui_meta_v1",
    "ui_surface_v1",
    "mcp_call_result_not_for_model_v1",
]

[model_runtime.runtimes.codex]
executable = "codex"
invocation_mode = "exec"
# environment_passthrough = []

[model_runtime.roles.raw_requirement_processor]
runtime = "claude"
# model = "..."   # omitted: use the local CLI default model

[model_runtime.roles.standard_requirement_processor]
runtime = "claude"
# model = "..."   # omitted: use the local CLI default model

# Independent review. A separate role, prompt, invocation and persisted
# artifact are what make Review independent of Process; configuring the same
# underlying model for both is accepted for v0.1 and reduces rather than
# removes correlated reasoning bias.
[model_runtime.roles.standard_requirement_reviewer]
runtime = "claude"
# model = "..."   # omitted: use the local CLI default model

[model_runtime.roles.tsa_architect]
runtime = "claude"
# model = "..."   # omitted: use the local CLI default model

[model_runtime.roles.tsa_reviewer]
runtime = "claude"
# model = "..."   # omitted: use the local CLI default model

# Selection precedence:
#   1. explicit run/CLI override
#   2. role runtime/model above
#   3. model_runtime.default
#   4. local CLI default model when model is omitted

# Delegated decisions (Requirement-Autonomous-Resolution-v0.1 §3).
#
# Standard Process may resolve a product question itself from authoritative
# sources (the originating RAW, the Requirement's own normative input, a
# DEPENDS_ON dependency) without any policy. A DELEGATED_DEFAULT — a decision
# no source settles — is authorized only by an approved clause here, and
# every resolution is independently verified by Review.
#
# "disabled" is default deny: no Project has delegated defaults. Enabling
# needs mode = "enabled" and, per Project code, a policy whose content hashes
# to the approved_fingerprint the approving human recorded. No policy is
# approved in this repository.
[autonomy]
mode = "disabled"

# Automatic Ready decisions (Requirement-Autonomous-Ready-v0.1 §3).
#
# A separate permission from [autonomy]: a delegated-default policy above
# authorizes no State transition. Only an authorization here lets the running
# worker decide at Ready for one Project, deterministically and without a
# model: AUTO_APPROVE (Ready -> Apply), AUTO_REWORK (Ready -> Process), or
# leave it at Ready for a human.
#
# "disabled" is default deny: Ready is the human boundary for every Project.
# Enabling needs mode = "enabled" and, per Project code, an authorization
# whose content hashes to the approved_fingerprint the approving operator
# recorded; every limit must be stated. No Project is authorized in this
# repository.
[ready_decisions]
mode = "disabled"
